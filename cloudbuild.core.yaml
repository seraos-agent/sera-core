# Dedicated build path for the private SERA Core runtime. The existing
# Dockerfile remains exclusively for the public reception service.
steps:
  - name: gcr.io/cloud-builders/docker
    # Built-in substitutions are expanded in step arguments. Do not nest
    # $PROJECT_ID inside a custom substitution value; Cloud Build keeps it
    # literal there and rejects the resulting Artifact Registry image name.
    args: ['build', '--file', 'Dockerfile.core', '--tag', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/sera-core-images/sera-core-api:latest', '.']

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/sera-core-images/sera-core-api:latest'
